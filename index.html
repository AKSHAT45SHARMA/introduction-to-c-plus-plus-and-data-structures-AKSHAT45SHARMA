<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargeZone Station Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-circles">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="container">
        <div class="scene">
            <div class="card">
                <div class="content">
                    <h1>Find ChargeZone Stations</h1>
                    <p class="description">Discover convenient charging stations for your electric vehicle using ChargeZone's growing network across India</p>
                    
                    <div class="search-container">
                        <div class="search-box">
                            <input type="text" placeholder="Enter your location or PIN code" />
                        </div>
                        
                        <div class="button-container">
                            <a href="https://www.chargezone.co.in/charge-locator" class="find-stations-btn">Find ChargeZone Stations</a>
                            <button class="find-stations-btn location-btn">Use Current Location</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
